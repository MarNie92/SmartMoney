[workspace]
resolver = "2"
members = [
    "apps/smartmoney-daemon",
    "crates/smartmoney-backtest",
    "crates/smartmoney-bot",
    "crates/smartmoney-collector",
    "crates/smartmoney-core",
    "crates/smartmoney-scorer",
    "crates/smartmoney-sim",
    "crates/smartmoney-store",
    "crates/smartmoney-web",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
smartmoney-core = { path = "crates/smartmoney-core" }
smartmoney-store = { path = "crates/smartmoney-store" }

anyhow = "1"
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
chrono-tz = "0.10"
fastrand = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
wiremock = "0.6"
smartmoney-collector = { path = "crates/smartmoney-collector" }
smartmoney-scorer = { path = "crates/smartmoney-scorer" }
smartmoney-web = { path = "crates/smartmoney-web" }
axum = "0.8"
maud = "0.27"
tower = { version = "0.5", features = ["util"] }
clap = { version = "4", features = ["derive"] }
futures = "0.3"
